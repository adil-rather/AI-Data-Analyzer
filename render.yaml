# One-click deploy to Render (free tier).
#   1. Push this repo to GitHub.
#   2. render.com -> New -> Blueprint -> connect the repo.
#   3. Click Deploy. Open the provided URL on your phone.
#
# The build compiles the React frontend into frontend/dist, then a single
# uvicorn process serves BOTH the API and the compiled app from one port.
services:
  - type: web
    name: ai-data-analyzer
    runtime: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
