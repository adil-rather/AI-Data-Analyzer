# One-click deploy to Render (free tier).
#   1. Push this repo to GitHub.
#   2. render.com -> New -> Blueprint -> connect the repo.
#   3. Click Deploy. Open the provided URL on your phone.
#
# The build compiles the React frontend into frontend/dist, then a single
# uvicorn process serves BOTH the API and the compiled app from one port.
services:
  - type: web
    name: ai-data-analyzer
    runtime: python
    plan: free
    # Install Python deps FIRST (this replaced Render's default pip step once we
    # set a custom buildCommand), then build the frontend.
    buildCommand: python -m pip install -r requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    # `python -m uvicorn` is more reliable than the bare `uvicorn` command.
    startCommand: python -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: NODE_VERSION
        value: 24.17.0
